# Test: Calendar Scheduled Movies Popover
# Tests that tapping a day with scheduled movies shows the popover with movie info and runtime
appId: com.oscars.tracker

---
- launchApp

# Wait for app to load
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 10000

# Navigate to Watch Plan tab
- tapOn: "Watch Plan"

# Wait for Watch Plan to load
- extendedWaitUntil:
    visible: "Watch Plan"
    timeout: 5000

# ========================================
# Test: Calendar Popover Shows Scheduled Movies
# ========================================

# First, we need movies in the plan to test the indicators
# Check if there are scheduled movies
- runFlow:
    when:
      visible: "TODAY"
    commands:
      # There are scheduled movies, proceed with test

      # Open Add to Plan to access the calendar
      - tapOn:
          text: "Add movie to plan"

      # Wait for sheet
      - extendedWaitUntil:
          visible: "Add to Plan"
          timeout: 5000

      # Select a movie to get to calendar
      - tapOn:
          index: 0

      # Wait for calendar
      - extendedWaitUntil:
          visible: "Select Date"
          timeout: 5000

      # The calendar should show indicators (dots) for days with scheduled movies
      # Tap on a day that has a scheduled movie indicator
      # This should show the popover with "Scheduled for [date]" and movie details

      - takeScreenshot: screenshots/07-calendar-with-scheduled-indicators

      # Try tapping "Today" which likely has a scheduled movie
      - tapOn:
          text: "selected"
          optional: true

      # If popover appears, verify content
      - runFlow:
          when:
            visible: "Scheduled for"
          commands:
            - takeScreenshot: screenshots/07-calendar-popover-visible

            # Verify popover shows movie title
            - assertVisible:
                text: ".*"

            # The runtime should be shown in parentheses next to movie title
            # e.g., "The Brutalist (3h 35m)"

            # Tap outside to dismiss popover
            - tapOn:
                point: "50%,20%"

      # Close the sheet
      - tapOn: "Back"
      - tapOn: "Cancel"

# ========================================
# Test: Move Sheet Also Shows Calendar Indicators
# ========================================

# If there are movies, test the move functionality
- runFlow:
    when:
      visible: "TODAY"
    commands:
      # Find and tap the move button on a scheduled movie
      - tapOn:
          text: "Move"
          optional: true

      # Wait for Move Movie sheet
      - extendedWaitUntil:
          visible: "Move Movie"
          timeout: 5000
          optional: true

      - runFlow:
          when:
            visible: "Move Movie"
          commands:
            - takeScreenshot: screenshots/07-move-calendar-indicators

            # Verify the calendar shows in the move sheet
            - assertVisible: "Select New Date"

            # Verify calendar day headers
            - assertVisible: "S"
            - assertVisible: "M"
            - assertVisible: "T"
            - assertVisible: "W"
            - assertVisible: "F"

            # Calendar should show indicators for other scheduled movies
            # Try tapping a day to see if popover appears

            # Close the sheet
            - tapOn: "Cancel"

# ========================================
# Test: Empty State (No Scheduled Movies)
# ========================================

- runFlow:
    when:
      notVisible: "TODAY"
    commands:
      # No movies scheduled, calendar should not have indicators

      # Open Add to Plan
      - tapOn:
          text: "Add movie to plan"

      - extendedWaitUntil:
          visible: "Add to Plan"
          timeout: 5000

      # Select a movie
      - tapOn:
          index: 0

      # Wait for calendar
      - extendedWaitUntil:
          visible: "Select Date"
          timeout: 5000

      - takeScreenshot: screenshots/07-calendar-no-indicators

      # Calendar should not show any indicator dots since no movies scheduled
      # Days should be tappable to select but no popover should appear

      # Close
      - tapOn: "Back"
      - tapOn: "Cancel"
