# Test: What Can I Watch Feature
# Tests the time-based movie recommendation feature
appId: com.oscars.tracker

---
- launchApp

# Wait for app to load
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 10000

# Navigate to Watch Plan tab
- tapOn: "Watch Plan"

# Wait for Watch Plan to load
- extendedWaitUntil:
    visible: "Watch Plan"
    timeout: 5000

# Tap What Can I Watch button (clock icon)
- tapOn:
    text: "What Can I Watch"

# Wait for What Can I Watch sheet
- extendedWaitUntil:
    visible: "What Can I Watch?"
    timeout: 5000

- takeScreenshot: screenshots/03-what-can-i-watch-main

# Verify time options are visible (2x2 grid)
- assertVisible: "How much time do you have?"
- assertVisible: "Short"
- assertVisible: "< 40m"
- assertVisible: "Medium"
- assertVisible: "< 90m"
- assertVisible: "Standard"
- assertVisible: "< 2h"
- assertVisible: "Unlimited"

# Tap on a time option (Short)
- tapOn: "Short"

# Wait for recommendation view
- extendedWaitUntil:
    visible: "Try Another"
    timeout: 5000

- takeScreenshot: screenshots/03-what-can-i-watch-recommendation

# Verify recommendation elements
- assertVisible: "Add to Plan"

# Go back to time selection
- tapOn: "Back"

# Verify we're back at time selection
- extendedWaitUntil:
    visible: "How much time do you have?"
    timeout: 3000

# Close the sheet
- tapOn: "Done"
