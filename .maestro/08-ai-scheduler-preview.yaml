# Test: AI Scheduler Preview and Confirmation Flow
# Tests the full flow of generating a plan and confirming it
appId: com.oscars.tracker

---
- launchApp

# Wait for app to load
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 10000

# Navigate to Watch Plan tab
- tapOn: "Watch Plan"

# Wait for Watch Plan to load
- extendedWaitUntil:
    visible: "Watch Plan"
    timeout: 5000

# ========================================
# Test: AI Scheduler Preview Screen Elements
# ========================================

# Open AI Scheduler
- tapOn:
    text: "Auto Scheduler"

# Wait for AI Scheduler sheet
- extendedWaitUntil:
    visible: "AI-Powered Scheduler"
    timeout: 5000

# Try to generate a plan with Fill Gaps
# This will test the full preview flow if there are unwatched movies
- tapOn: "Fill Gaps"

# Wait for result (loading, preview, or error)
- extendedWaitUntil:
    visible: ".*"
    timeout: 30000

- takeScreenshot: screenshots/08-ai-after-fill-gaps

# ========================================
# Test: Preview Screen When Plan Generated
# ========================================

# Check if we got a preview
- runFlow:
    when:
      visible: "AI Schedule Preview"
    commands:
      - takeScreenshot: screenshots/08-ai-preview-screen

      # Verify preview header
      - assertVisible: "AI Suggested Schedule"

      # Verify Confirm Schedule button
      - assertVisible: "Confirm Schedule"

      # Verify Back button in toolbar
      - assertVisible: "Back"

      # Scroll through the suggested movies
      - swipe:
          direction: UP
          duration: 500

      - takeScreenshot: screenshots/08-ai-preview-scrolled

      # Test Back button - should go back to prompt screen
      - tapOn: "Back"

      # Verify we're back at the prompt screen
      - extendedWaitUntil:
          visible: "Quick Actions"
          timeout: 5000

      - assertVisible: "Fill Gaps"
      - assertVisible: "Reschedule Overdue"
      - assertVisible: "Reorganize Plan"

# Close the sheet if still open
- tapOn:
    text: "Cancel"
    optional: true
