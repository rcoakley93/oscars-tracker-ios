# Test: App Launch and Navigation
# Verifies the app launches and shows main tabs
# Prerequisites: User must be logged in
appId: com.oscars.tracker

---
- launchApp

# Wait for app to load (allows time for auth check)
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 15000

# Take screenshot of initial state
- takeScreenshot: screenshots/01-dashboard

# Verify main tabs are visible
- assertVisible: "Dashboard"
- assertVisible: "Watch Plan"
- assertVisible: "Ballot"
- assertVisible: "Leaderboard"
- assertVisible: "More"
