# Test: Watch Plan Features
# Tests the Watch Plan tab and its features
appId: com.oscars.tracker

---
- launchApp

# Wait for app to load
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 10000

# Navigate to Watch Plan tab
- tapOn: "Watch Plan"

# Wait for Watch Plan to load
- extendedWaitUntil:
    visible: "Watch Plan"
    timeout: 5000

- takeScreenshot: screenshots/02-watch-plan-main

# ========================================
# Test: Watch Plan Header Stats
# ========================================

# Verify stats are shown (Planned, Unplanned, Watched counts)
- assertVisible:
    text: "PLANNED"
    optional: true
- assertVisible:
    text: "UNPLANNED"
    optional: true

# ========================================
# Test: AI Auto Scheduler
# ========================================

# Test AI Auto Scheduler button (magic wand icon)
- tapOn:
    text: "Auto Scheduler"

# Wait for AI Scheduler sheet
- extendedWaitUntil:
    visible: "AI-Powered Scheduler"
    timeout: 5000

- takeScreenshot: screenshots/02-ai-scheduler-sheet

# Verify AI header
- assertVisible: "AI-Powered Scheduler"
- assertVisible: "Tell me how you'd like to organize your movie watching"

# Verify prompt input section
- assertVisible: "What would you like me to do?"

# Verify Quick Actions section
- assertVisible: "Quick Actions"

# Verify all three quick action buttons with correct labels
- assertVisible: "Fill Gaps"
- assertVisible: "Add movies to empty days"

- assertVisible: "Reschedule Overdue"
- assertVisible: "Move missed movies forward"

- assertVisible: "Reorganize Plan"
- assertVisible: "Optimize your schedule"

# Verify Generate Plan button (should be disabled initially)
- assertVisible: "Generate Plan"

# Verify stats summary at bottom
- assertVisible: "Unwatched"
- assertVisible: "Scheduled"

# ========================================
# Test: Custom Prompt Input
# ========================================

# Tap on text input area
- tapOn: "What would you like me to do?"

# Enter a custom prompt
- inputText: "Schedule short movies on weekdays"

- takeScreenshot: screenshots/02-ai-scheduler-custom-prompt

# Hide keyboard
- hideKeyboard

# Generate Plan button should now be enabled
- assertVisible: "Generate Plan"

# Clear the prompt by closing and reopening
- tapOn: "Cancel"

# Wait for sheet to close
- extendedWaitUntil:
    visible: "Watch Plan"
    timeout: 3000

# ========================================
# Test: Add to Plan Button
# ========================================

# Verify Add to Plan button exists
- assertVisible:
    text: "Add movie to plan"
